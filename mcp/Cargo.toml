[package]
name = "bolt-mcp"
version = "0.1.0"
edition = "2024"
authors = ["ghostkellz <ghostkellz@proton.me>"]
description = "MCP Gateway for Bolt Container Runtime"
license = "MIT"

[lib]
name = "bolt_mcp"
path = "src/lib.rs"

[[bin]]
name = "bolt-mcp-gateway"
path = "src/bin/gateway.rs"

[dependencies]
# Core Bolt library
bolt = { path = ".." }

# Glyph MCP library
glyph = { git = "https://github.com/ghostkellz/glyph", features = ["server", "websocket", "metrics"] }

# OMEN AI Router
omen = { git = "https://github.com/ghostkellz/omen" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.0", features = ["derive"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Collections
dashmap = "6.0"
indexmap = "2.0"

# Environment variables
dotenv = "0.15"

[features]
default = []
docker-desktop = []  # Enable Docker Desktop secrets integration
omen = []  # Enable OMEN AI router integration
