[workspace]
members = ["."]

[package]
name = "bolt"
version = "0.1.1"
edition = "2024"
description = "Performance-first Rust container runtime with revolutionary networking, GPU optimization, and intelligent resource management"
license = "MIT"
authors = ["ghostkellz <ghostkellz@proton.me>"]
repository = "https://github.com/CK-Technology/bolt"
homepage = "https://github.com/CK-Technology/bolt"
documentation = "https://github.com/CK-Technology/bolt#api"
readme = "README.md"
keywords = ["containers", "performance", "gpu", "quic", "networking", "optimization"]
categories = ["virtualization", "development-tools", "network-programming"]
rust-version = "1.91"

[lib]
name = "bolt"
path = "src/lib.rs"

[[bin]]
name = "bolt"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4.4", features = ["derive", "env"] }
# Configuration
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["compat"] }
# Error handling
anyhow = "1.0"
thiserror = "1.0"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# === PHASE 1: OCI RUNTIME & CONTAINERS ===
# OCI runtime components
oci-spec = { version = "0.6", optional = true }
# Container runtime components
# libcontainer = "0.3"  # Not available, use alternatives
# oci-distribution = "0.10"  # Not available, implement custom
# docker-api = "0.14"  # Not available, use reqwest
# Filesystem and storage
tempfile = "3.8"

# === PHASE 2: BOLT CAPSULES (VM-LIKE) ===
# Virtualization components (commented out for now)
# kvm-ioctls = "0.16"  # For VM capabilities
# vm-memory = "0.14"   # Memory management
# Memory management
memmap2 = "0.9"
# Process isolation
# caps = "0.5"  # Linux capabilities
# Security profiles
# libseccomp = "0.3"  # Seccomp filtering

# === PHASE 3: QUIC NETWORKING ===
# QUIC implementation - using quinn (pure Rust, no C dependencies)
# quiche = { version = "0.21", optional = true }  # Disabled due to cmake dependency
quinn = { version = "0.11", optional = true }
rustls = { version = "0.23", features = ["std"], optional = true }
rcgen = { version = "0.12", optional = true }
ipnet = { version = "2.9", optional = true }
# DNS and service discovery
# trust-dns-client = "0.23"  # Use hickory-dns instead
# trust-dns-server = "0.23"   # Use hickory-dns instead
# hickory-dns = "0.24"  # Has dependency issues
# Networking utilities
socket2 = { version = "0.5", features = ["all"] }
# netlink-packet-core = "0.7"     # Linux-specific
# netlink-packet-route = "0.17"   # Linux-specific

# === PHASE 4: REPRODUCIBLE BUILDS ===
# Content addressing
sha2 = "0.10"
blake3 = "1.5"
# Compression
zstd = "0.13"
tar = "0.4.45"
flate2 = "1.0"
# Build isolation
# sandbox = "0.2"  # May not be available

# === GAMING INFRASTRUCTURE ===
# GPU management
nvml-wrapper = { version = "0.11", optional = true }  # NVIDIA Management Library for direct GPU monitoring
# Wayland support
wayland-client = { version = "0.31", optional = true }
smithay-client-toolkit = { version = "0.18", optional = true }
# Audio systems
# pipewire = "0.8"  # Linux-specific audio
# pulse = "2.5"     # PulseAudio bindings

# === SYSTEM INTERFACES ===
# Low-level system calls
nix = { version = "0.27", features = ["process", "mount", "sched", "user", "net", "signal", "fs", "term"], optional = true }
# Cgroups management
# cgroups-rs = "0.3"  # Linux-specific
# Namespace management
# unshare = "0.7"     # Linux-specific
# Filesystem operations
walkdir = "2.4"
# Process management
# procfs = "0.16"  # Linux-specific

# === UTILITIES ===
# Serialization
bincode = "1.3"
# UUID generation
uuid = { version = "1.8", features = ["v4"] }
# Time handling
chrono = { version = "0.4", features = ["serde"] }
# Async utilities
futures = "0.3"
futures-util = "0.3"
# Unix socket support for Docker compatibility
hyperlocal = "0.8"
hyper = { version = "1.0", features = ["full"] }
# HTTP client for registries
reqwest = { version = "0.11", features = ["json", "stream", "multipart"] }
# JSON handling
serde_json = "1.0"
# Regular expressions
regex = "1.10"
# TLS certificate generation
# rcgen moved to QUIC networking section
# Random number generation
rand = "0.8"
# Directory utilities
dirs = "5.0"
# AWS SDK for S3 storage
aws-config = "1.1"
aws-sdk-s3 = "1.14"
aws-smithy-types = "1.1"
# YAML parsing for compose files
serde_yaml = "0.9"
# CPU detection for container resource management
num_cpus = "1.16"
# Plugin system
libloading = "0.8"
# Hash computation for plugin verification
hex = "0.4"
# Async trait support for plugins
async-trait = "0.1"
# Bytes manipulation
bytes = "1.11"
# GPU passthrough support (native implementation)
# Monitoring and observability
warp = "0.3"
hostname = "0.4"
axum = { version = "0.7", features = ["ws"], optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }
# Tracing and logging
tracing-appender = "0.2"
# Metrics and monitoring
# opentelemetry = { version = "0.20", features = ["rt-tokio"] }
# opentelemetry-jaeger = { version = "0.19", features = ["rt-tokio"] }

# gRPC framework (for gRPC-over-QUIC)
tonic = { version = "0.11", optional = true }
prost = { version = "0.12", optional = true }
tower = { version = "0.4", optional = true }
# hyper already defined above with "full" features (includes server, http2)
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http = { version = "1.0", optional = true }
http-body-util = { version = "0.1", optional = true }


[dev-dependencies]
tempfile = "3.8"
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
proptest = "1.4"
tokio-test = "0.4"
test-case = "3.1"
pretty_assertions = "1.4"
mockall = "0.12"
bytes = "1.11"
serde_yaml = "0.9"
num_cpus = "1.16"

[build-dependencies]
tonic-build = "0.11"

[[bench]]
name = "quic_benchmarks"
harness = false
required-features = ["quic-networking"]

[[bench]]
name = "grpc_quic_latency"
harness = false
required-features = ["grpc"]

[features]
default = ["gaming", "quic-networking", "oci-runtime"]

# Core features
gaming = ["wayland-client", "smithay-client-toolkit"]
quic-networking = ["quinn", "rustls", "rcgen", "ipnet"]
oci-runtime = ["oci-spec", "nix"]

# Optional GPU support
nvidia-support = ["nvml-wrapper"]  # Enable NVIDIA ML management
amd-support = []     # Enable with ROCm support
intel-support = []   # Enable with Intel Arc support (future)
ai-ml = []           # Enable AI/ML integration tests
snapshots = []       # Enable snapshot integration tests

# WebSocket support
websocket = ["axum", "tower-http"]  # Enable WebSocket support for real-time metrics streaming

# gRPC integration (hyper is always included via hyperlocal dependency)
grpc = ["tonic", "prost", "tower", "hyper-util", "http", "http-body-util"]  # Enable gRPC-over-QUIC support

# Development features
examples = []
