syntax = "proto3";

package bolt.mcp;

// MCP Tool Service - Exposes MCP tools via gRPC
// This enables AI agents (like Reaper.grim) to call container tools remotely
service MCPToolService {
  // List available MCP tools for a container
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);

  // Get detailed schema for a specific tool
  rpc GetToolSchema(GetToolSchemaRequest) returns (GetToolSchemaResponse);

  // Call an MCP tool with arguments
  rpc CallTool(CallToolRequest) returns (CallToolResponse);

  // Stream tool execution (for long-running tasks)
  rpc CallToolStream(CallToolRequest) returns (stream CallToolStreamResponse);

  // Get MCP server capabilities
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
}

// List available tools
message ListToolsRequest {
  string container_id = 1;

  // Optional filters
  repeated string categories = 2;  // e.g., ["filesystem", "shell"]
  bool include_disabled = 3;
}

message ListToolsResponse {
  repeated MCPTool tools = 1;
}

message MCPTool {
  string name = 1;                    // e.g., "filesystem:read"
  string description = 2;
  string category = 3;                // e.g., "filesystem", "shell", "gpu"
  string input_schema_json = 4;      // JSON schema for tool inputs
  bool enabled = 5;
  map<string, string> metadata = 6;  // Additional tool metadata
}

// Get tool schema
message GetToolSchemaRequest {
  string container_id = 1;
  string tool_name = 2;
}

message GetToolSchemaResponse {
  string tool_name = 1;
  string input_schema_json = 2;
  string output_schema_json = 3;
  repeated string examples = 4;      // Example usage
}

// Call a tool
message CallToolRequest {
  string container_id = 1;
  string tool_name = 2;
  string arguments_json = 3;         // JSON-encoded tool arguments

  // Execution options
  uint32 timeout_seconds = 4;        // Max execution time
  bool stream_output = 5;             // Stream results or wait for completion
  map<string, string> context = 6;   // Additional context (user, session, etc.)
}

message CallToolResponse {
  bool success = 1;
  string result_json = 2;             // JSON-encoded result
  string error = 3;

  // Execution metadata
  uint64 execution_time_ms = 4;
  string tool_version = 5;
  map<string, string> metadata = 6;
}

// Streaming tool output
message CallToolStreamResponse {
  oneof event {
    ToolStarted started = 1;
    ToolProgress progress = 2;
    ToolOutput output = 3;
    ToolComplete complete = 4;
    ToolError error = 5;
  }
}

message ToolStarted {
  string tool_name = 1;
  int64 timestamp = 2;
}

message ToolProgress {
  string message = 1;
  uint32 percent_complete = 2;
}

message ToolOutput {
  string stream = 1;    // "stdout" or "stderr"
  bytes data = 2;
}

message ToolComplete {
  bool success = 1;
  string result_json = 2;
  uint64 execution_time_ms = 3;
}

message ToolError {
  string error = 1;
  string error_code = 2;
}

// Get server capabilities
message GetCapabilitiesRequest {
  string container_id = 1;
}

message GetCapabilitiesResponse {
  MCPCapabilities capabilities = 1;
}

message MCPCapabilities {
  bool supports_streaming = 1;
  bool supports_cancellation = 2;
  bool supports_async_tools = 3;
  repeated string supported_categories = 4;
  string protocol_version = 5;       // MCP protocol version
  map<string, string> extensions = 6;
}

// MCP Resource Service - For AI agents to access container resources
service MCPResourceService {
  // List available resources
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse);

  // Read a resource
  rpc ReadResource(ReadResourceRequest) returns (ReadResourceResponse);

  // Subscribe to resource changes
  rpc SubscribeResource(SubscribeResourceRequest) returns (stream ResourceUpdate);
}

message ListResourcesRequest {
  string container_id = 1;
  string uri_pattern = 2;            // Glob pattern, e.g., "file:///workspace/**"
}

message ListResourcesResponse {
  repeated MCPResource resources = 1;
}

message MCPResource {
  string uri = 1;                    // e.g., "file:///workspace/src/main.rs"
  string name = 2;
  string description = 3;
  string mime_type = 4;
  int64 size_bytes = 5;
  int64 modified_timestamp = 6;
}

message ReadResourceRequest {
  string container_id = 1;
  string uri = 2;
}

message ReadResourceResponse {
  string uri = 1;
  oneof content {
    string text = 2;
    bytes blob = 3;
  }
  string mime_type = 4;
}

message SubscribeResourceRequest {
  string container_id = 1;
  string uri_pattern = 2;
}

message ResourceUpdate {
  string uri = 1;
  string event_type = 2;  // "created", "modified", "deleted"
  int64 timestamp = 3;
}

// MCP Prompt Service - For AI context management
service MCPPromptService {
  // List available prompts/templates
  rpc ListPrompts(ListPromptsRequest) returns (ListPromptsResponse);

  // Get a prompt with filled arguments
  rpc GetPrompt(GetPromptRequest) returns (GetPromptResponse);
}

message ListPromptsRequest {
  string container_id = 1;
}

message ListPromptsResponse {
  repeated MCPPrompt prompts = 1;
}

message MCPPrompt {
  string name = 1;
  string description = 2;
  repeated PromptArgument arguments = 3;
}

message PromptArgument {
  string name = 1;
  string description = 2;
  bool required = 3;
}

message GetPromptRequest {
  string container_id = 1;
  string prompt_name = 2;
  map<string, string> arguments = 3;
}

message GetPromptResponse {
  string prompt_name = 1;
  repeated PromptMessage messages = 2;
}

message PromptMessage {
  string role = 1;     // "user", "assistant", "system"
  string content = 2;
}

// MCP Configuration Service
service MCPConfigService {
  // Get MCP configuration for a container
  rpc GetConfig(GetMCPConfigRequest) returns (GetMCPConfigResponse);

  // Update MCP configuration
  rpc UpdateConfig(UpdateMCPConfigRequest) returns (UpdateMCPConfigResponse);

  // Enable/disable specific tools
  rpc SetToolEnabled(SetToolEnabledRequest) returns (SetToolEnabledResponse);
}

message GetMCPConfigRequest {
  string container_id = 1;
}

message GetMCPConfigResponse {
  MCPConfig config = 1;
}

message MCPConfig {
  bool enabled = 1;
  repeated string enabled_tools = 2;
  map<string, string> tool_permissions = 3;
  OmenConfig omen = 4;
}

message OmenConfig {
  bool enabled = 1;
  string routing_strategy = 2;       // "cost_optimized", "latency_optimized", "balanced"
  repeated string providers = 3;      // ["anthropic", "openai", "ollama"]
  double max_cost_per_hour = 4;
  map<string, string> provider_config = 5;
}

message UpdateMCPConfigRequest {
  string container_id = 1;
  MCPConfig config = 2;
}

message UpdateMCPConfigResponse {
  bool success = 1;
  string error = 2;
}

message SetToolEnabledRequest {
  string container_id = 1;
  string tool_name = 2;
  bool enabled = 3;
}

message SetToolEnabledResponse {
  bool success = 1;
  string error = 2;
}
