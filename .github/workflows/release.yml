name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.0)'
        required: true

env:
  RUST_VERSION: "1.85.0"
  CARGO_TERM_COLOR: always

jobs:
  build-binary:
    name: Build Release Binary
    runs-on: self-hosted
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION#v}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu

      - name: Build release binary
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu \
            --features "oci-runtime,quic-networking,gaming,nvidia-support"

      - name: Strip binary
        run: strip target/x86_64-unknown-linux-gnu/release/bolt

      - name: Create tarball
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/bolt dist/
          cp README.md LICENSE dist/ 2>/dev/null || true
          cd dist
          tar czf bolt-${{ steps.version.outputs.version }}-x86_64-linux.tar.gz bolt README.md LICENSE 2>/dev/null || \
          tar czf bolt-${{ steps.version.outputs.version }}-x86_64-linux.tar.gz bolt
          sha256sum bolt-${{ steps.version.outputs.version }}-x86_64-linux.tar.gz > bolt-${{ steps.version.outputs.version }}-x86_64-linux.tar.gz.sha256

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bolt-binary
          path: |
            dist/bolt-*.tar.gz
            dist/bolt-*.sha256
            target/x86_64-unknown-linux-gnu/release/bolt

  build-deb:
    name: Build Debian Package
    runs-on: self-hosted
    needs: build-binary
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: bolt-binary
          path: dist

      - name: Install packaging tools
        run: |
          sudo apt-get update || true
          sudo apt-get install -y dpkg-dev fakeroot

      - name: Build .deb package
        run: |
          VERSION=${{ needs.build-binary.outputs.version }}
          PKG_DIR="bolt_${VERSION}_amd64"

          mkdir -p ${PKG_DIR}/DEBIAN
          mkdir -p ${PKG_DIR}/usr/bin
          mkdir -p ${PKG_DIR}/lib/systemd/system
          mkdir -p ${PKG_DIR}/etc/bolt
          mkdir -p ${PKG_DIR}/usr/share/doc/bolt

          # Copy binary
          cp dist/target/x86_64-unknown-linux-gnu/release/bolt ${PKG_DIR}/usr/bin/
          chmod 755 ${PKG_DIR}/usr/bin/bolt

          # Copy service and config from debian/
          cp debian/bolt.service ${PKG_DIR}/lib/systemd/system/
          cp debian/bolt.toml ${PKG_DIR}/etc/bolt/

          # Create control file
          cat > ${PKG_DIR}/DEBIAN/control << EOF
          Package: bolt
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: CK Technology <ghostkellz@proton.me>
          Depends: libc6, libssl3, systemd
          Recommends: nvidia-utils
          Homepage: https://github.com/CK-Technology/bolt
          Description: Next-generation Rust container runtime
           Bolt is a modern container runtime with gaming optimizations,
           GPU passthrough, QUIC networking, and OCI compatibility.
          EOF

          # Create postinst
          cat > ${PKG_DIR}/DEBIAN/postinst << 'EOF'
          #!/bin/bash
          set -e
          systemctl daemon-reload || true
          echo "Bolt installed. Enable with: sudo systemctl enable --now bolt"
          EOF
          chmod 755 ${PKG_DIR}/DEBIAN/postinst

          # Create prerm
          cat > ${PKG_DIR}/DEBIAN/prerm << 'EOF'
          #!/bin/bash
          set -e
          systemctl stop bolt || true
          systemctl disable bolt || true
          EOF
          chmod 755 ${PKG_DIR}/DEBIAN/prerm

          # Build package
          fakeroot dpkg-deb --build ${PKG_DIR}
          mv ${PKG_DIR}.deb bolt_${VERSION}_amd64.deb
          sha256sum bolt_${VERSION}_amd64.deb > bolt_${VERSION}_amd64.deb.sha256

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: bolt-deb
          path: |
            bolt_*.deb
            bolt_*.deb.sha256

  build-rpm:
    name: Build Fedora RPM
    runs-on: self-hosted
    needs: build-binary
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: bolt-binary
          path: dist

      - name: Install RPM tools
        run: |
          # Try to install rpm-build (works on Fedora/RHEL or with alien on Debian)
          if command -v dnf &> /dev/null; then
            sudo dnf install -y rpm-build
          elif command -v apt-get &> /dev/null; then
            sudo apt-get update || true
            sudo apt-get install -y rpm
          fi

      - name: Build .rpm package
        run: |
          VERSION=${{ needs.build-binary.outputs.version }}

          # Setup RPM build directories
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          # Copy binary and files to SOURCES
          cp dist/target/x86_64-unknown-linux-gnu/release/bolt ~/rpmbuild/SOURCES/
          cp debian/bolt.service ~/rpmbuild/SOURCES/
          cp debian/bolt.toml ~/rpmbuild/SOURCES/

          # Create spec file
          cat > ~/rpmbuild/SPECS/bolt.spec << EOF
          Name:           bolt
          Version:        ${VERSION}
          Release:        1%{?dist}
          Summary:        Next-generation Rust container runtime

          License:        MIT
          URL:            https://github.com/CK-Technology/bolt

          Requires:       systemd
          Recommends:     nvidia-utils

          %description
          Bolt is a modern container runtime written in Rust with gaming
          optimizations, GPU passthrough, QUIC networking, and OCI compatibility.

          %install
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/lib/systemd/system
          mkdir -p %{buildroot}/etc/bolt

          install -m 755 %{_sourcedir}/bolt %{buildroot}/usr/bin/bolt
          install -m 644 %{_sourcedir}/bolt.service %{buildroot}/lib/systemd/system/bolt.service
          install -m 644 %{_sourcedir}/bolt.toml %{buildroot}/etc/bolt/bolt.toml

          %files
          /usr/bin/bolt
          /lib/systemd/system/bolt.service
          %config(noreplace) /etc/bolt/bolt.toml

          %post
          systemctl daemon-reload || true

          %preun
          systemctl stop bolt || true
          systemctl disable bolt || true

          %changelog
          * $(date "+%a %b %d %Y") CK Technology <ghostkellz@proton.me> - ${VERSION}-1
          - Release ${VERSION}
          EOF

          # Build RPM
          rpmbuild -bb ~/rpmbuild/SPECS/bolt.spec || echo "RPM build skipped (tools not available)"

          # Copy output
          if [ -f ~/rpmbuild/RPMS/x86_64/bolt-${VERSION}-1*.rpm ]; then
            cp ~/rpmbuild/RPMS/x86_64/bolt-${VERSION}-1*.rpm ./
            sha256sum bolt-${VERSION}-1*.rpm > bolt-${VERSION}-1.x86_64.rpm.sha256
          fi

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: bolt-rpm
          path: |
            bolt-*.rpm
            bolt-*.rpm.sha256
        if: always()

  create-release:
    name: Create GitHub Release
    runs-on: self-hosted
    needs: [build-binary, build-deb, build-rpm]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.deb" -o -name "*.rpm" -o -name "*.sha256" \) -exec cp {} release/ \;
          ls -la release/

      - name: Generate changelog
        id: changelog
        run: |
          VERSION=${{ needs.build-binary.outputs.version }}

          # Get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s" --no-merges -20)
          fi

          cat > release_notes.md << EOF
          ## Bolt v${VERSION}

          ### Installation

          **Arch Linux:**
          \`\`\`bash
          # Using PKGBUILD
          git clone https://github.com/CK-Technology/bolt
          cd bolt && makepkg -si
          \`\`\`

          **Debian/Ubuntu:**
          \`\`\`bash
          wget https://github.com/CK-Technology/bolt/releases/download/v${VERSION}/bolt_${VERSION}_amd64.deb
          sudo dpkg -i bolt_${VERSION}_amd64.deb
          \`\`\`

          **Fedora/RHEL:**
          \`\`\`bash
          wget https://github.com/CK-Technology/bolt/releases/download/v${VERSION}/bolt-${VERSION}-1.x86_64.rpm
          sudo rpm -i bolt-${VERSION}-1.x86_64.rpm
          \`\`\`

          **Generic Linux:**
          \`\`\`bash
          wget https://github.com/CK-Technology/bolt/releases/download/v${VERSION}/bolt-${VERSION}-x86_64-linux.tar.gz
          tar xzf bolt-${VERSION}-x86_64-linux.tar.gz
          sudo mv bolt /usr/local/bin/
          \`\`\`

          ### Changes
          ${CHANGES}

          ### Checksums
          See \`.sha256\` files for verification.
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Bolt v${{ needs.build-binary.outputs.version }}
          body_path: release_notes.md
          files: release/*
          draft: false
          prerelease: ${{ contains(needs.build-binary.outputs.version, 'alpha') || contains(needs.build-binary.outputs.version, 'beta') || contains(needs.build-binary.outputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
